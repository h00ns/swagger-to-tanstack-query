<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#11151D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#36D7E3" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#36D7E3" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#36D7E3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#36D7E3"/>

  <!-- logo mark -->
  <g transform="translate(90, 96)">
    <rect width="84" height="84" rx="18" fill="#0B0E14" stroke="#36D7E3" stroke-width="2"/>
    <text x="42" y="54" font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="700" fill="#36D7E3" text-anchor="middle">s2tq</text>
  </g>
  <text x="196" y="150" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#A3ACBD">swagger-to-tanstack-query</text>

  <!-- headline -->
  <text x="90" y="300" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="700" fill="#EDF0F5">Swagger / OpenAPI</text>
  <text x="90" y="392" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="700" fill="#36D7E3">&#8594; TanStack Query</text>

  <!-- subhead -->
  <text x="92" y="470" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#A3ACBD">Fully type-safe queryOptions hooks, axios APIs &amp; TypeScript types —</text>
  <text x="92" y="512" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#A3ACBD">one folder per controller, using your own axios instance.</text>

  <!-- pills -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="500">
    <rect x="90" y="556" width="150" height="44" rx="22" fill="#36D7E3" fill-opacity="0.12"/>
    <text x="165" y="584" fill="#36D7E3" text-anchor="middle">TypeScript</text>
    <rect x="256" y="556" width="118" height="44" rx="22" fill="#36D7E3" fill-opacity="0.12"/>
    <text x="315" y="584" fill="#36D7E3" text-anchor="middle">React</text>
    <rect x="390" y="556" width="104" height="44" rx="22" fill="#36D7E3" fill-opacity="0.12"/>
    <text x="442" y="584" fill="#36D7E3" text-anchor="middle">axios</text>
  </g>
</svg>
